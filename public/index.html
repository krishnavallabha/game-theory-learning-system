  math: R`<p><b>4×2 example (lecture).</b> Player 1’s payoffs vs X, Y: A (12, 0), B (11, 1), C (10, 4), D (9, 6). With $q=\Pr(X)$: $A=12q$, $B=1+10q$, $C=4+6q$, $D=6+3q$.</p><ol><li>$A=D$ at $q=2/3$, where $A=C=D=8$ and $B=23/3<8$. For $q<2/3$ D is best, for $q>2/3$ A is best. B is never best ⇒ strictly dominated by a mixture, e.g. $\tfrac34A+\tfrac14D$: (11.25, 1.5) > (11, 1).</li><li>Player 2’s payoffs vs A, C, D: X (0, 2, 3), Y (6, 2, 0). With P1 mixing $(p,r,1-p-r)$ on (A,C,D): $U_2(X)=3-3p-r$, $U_2(Y)=6p+2r$.</li><li>Player 2 mixes ($q=2/3$) only if indifferent: $3-3p-r=6p+2r\Rightarrow 3p+r=1$.</li><li>So every $(p,r)$ with $3p+r=1$, $p,r\ge0$ — from pure C $(0,1)$ to $\tfrac13A+\tfrac23D$ $(\tfrac13,0)$ — paired with $q=2/3$ is an NE: a <b>continuum</b>.</li></ol>`,
  ex: [
    { lvl: 'Introductory', t: 'Spot NBR', q: R`<p>A (3,0), B (0,3), C (1,1) for row vs L, R. Is C ever a best response?</p>`, s: R`<p>$U(A)=3q$, $U(B)=3-3q$, $U(C)=1$. Max(A,B) ≥ 1.5 > 1 always ⇒ C is NBR (dominated by ½A+½B).</p>` },
    { lvl: 'Standard', t: 'War game (lecture 4a)', q: R`<p>U: (9,1),(1,6),(1,0); M: (3,2),(0,0),(3,5); D: (4,2),(4,4),(0,4). Eliminate by mixed dominance and find pure NE of what remains.</p>`, s: R`<p>L is dominated for P2 by ½C+½R: (3, 2.5, 4) > (1, 2, 2). Then U is dominated for P1 by ½M+½D: (2, 1.5) > (1, 1). Remaining M,D × C,R: (0,0),(3,5)/(4,4),(0,4). Pure NE: (M,R) and also (D,C) (P2 indifferent 4 = 4; P1 prefers D vs C). NotebookLM’s notes report only (M,R) after deleting the weakly dominated C — flagged.</p>` },
    { lvl: 'Exam-level', t: 'Continuum check', q: R`<p>Verify $(p,r)=(1/6,1/2)$ with $q=2/3$ is an NE of the 4×2 game.</p>`, s: R`<p>$3(1/6)+1/2=1$ ✓ ⇒ P2 indifferent ($U_2(X)=3-0.5-0.5=2$, $U_2(Y)=1+1=2$). At $q=2/3$, A, C, D all give 8 ≥ B’s 7.67 ⇒ P1’s mixture on {A,C,D} is a best response. NE ✓.</p>` }],
  vis: R`${M.plot({ xr: [0, 1], yr: [0, 13], xlab: 'q = Pr(X)', ylab: 'u₁', lines: [{ f: q => 12 * q, lab: 'A' }, { f: q => 1 + 10 * q, lab: 'B', dash: true }, { f: q => 4 + 6 * q, lab: 'C' }, { f: q => 6 + 3 * q, lab: 'D' }], pts: [{ x: 2 / 3, y: 8, lab: 'q = 2/3, u = 8' }], xt: [[0, '0'], [2 / 3, '⅔'], [1, '1']], yt: [[6, '6'], [8, '8'], [12, '12']], cap: 'B (dashed) is never on the upper envelope: never a best response.' })}`,
  conn: R`<p>Generalises <a href="#/c/mixed-dom">mixed dominance</a>; relation stated in <a href="#/c/sol-relations">solution-concept relations</a>.</p>`,
  mis: R`<ul><li>Only checking pure dominance to conclude an action is “rationalizable”.</li><li>Believing mixed equilibria are always isolated.</li></ul>`,
  exam: R`${M.exam(R`<p>Possible true/false (course assignment) or an “is action X dominated?” item.</p>`)}` });

C({ id: 'bystander', week: 3, title: 'Reporting a crime: the bystander model', pri: 'Medium',
  src: { notes: '✓ §3.6', text: '— (Osborne application)', lec: '✓ W3_L3' }, prereq: ['indifference'],
  misShort: 'Expecting more witnesses to make reporting more likely.',
  intu: R`<p>Everyone who sees a crime wants it reported, but calling is costly. If you think others will call, you free-ride. In the symmetric mixed equilibrium, adding witnesses makes each individual call less often — so much less that the crime is <em>less</em> likely to be reported at all.</p>`,
  why: R`<ul><li>Classic n-player indifference application; formula questions are likely.</li></ul>`,
  formal: R`${M.def(R`<p>$n$ witnesses; Report ($R$) costs $C$; everyone gets $V$ if at least one reports; $V>C>0$. $u_i(R,\cdot)=V-C$; $u_i(N,\text{someone reports})=V$; $u_i(N,\text{nobody})=0$.</p>`)}`,
  math: R`<ol><li>Symmetric mixed NE: each plays N with probability $p$.</li><li>$U(R)=V-C$; $U(N)=V(1-p^{n-1})$.</li><li>Indifference: $V(1-p^{n-1})=V-C\Rightarrow p^{n-1}=C/V\Rightarrow p^*=(C/V)^{1/(n-1)}$.</li><li>Pr(crime reported) $=1-(p^*)^n=1-(C/V)^{n/(n-1)}$.</li><li>As $n\to\infty$: $p^*\to1$ (individuals almost never call) and Pr(reported) $\downarrow 1-C/V$.</li></ol>`,
  ex: [
    { lvl: 'Introductory', t: 'Two witnesses', q: R`<p>$n=2$, $C/V=1/4$. Prob. each does not call? Prob. reported?</p>`, s: R`<p>$p=1/4$; reported $1-(1/4)^2=15/16$.</p>` },
    { lvl: 'Standard', t: 'Three witnesses', q: R`<p>$n=3$, $C/V=1/4$. Same questions.</p>`, s: R`<p>$p=(1/4)^{1/2}=1/2$; reported $1-(1/2)^3=7/8<15/16$.</p>` },
    { lvl: 'Exam-level', t: 'Limit', q: R`<p>$C/V=0.36$. Find Pr(reported) for $n=2$ and its limit as $n\to\infty$.</p>`, s: R`<p>$n=2$: $1-0.36^2=0.8704$. Limit: $1-0.36=0.64$.</p>` }],
  vis: R`${M.plot({ xr: [2, 12], yr: [0.6, 1], xlab: 'n', ylab: 'Pr(reported)', lines: [{ f: n => 1 - Math.pow(0.25, n / (n - 1)), lab: 'C/V=¼' }], xt: [[2, '2'], [4, '4'], [8, '8'], [12, '12']], yt: [[0.75, '0.75'], [0.9375, '15/16'], [1, '1']], cap: 'Probability the crime is reported falls towards 1 − C/V = 0.75 as n grows.' })}`,
  conn: R`<p>An $n$-player <a href="#/c/indifference">indifference</a> computation; free-riding like the <a href="#/c/pd">PD</a>.</p>`,
  mis: R`<ul><li>Using $p^n$ instead of $p^{n-1}$ in the indifference condition (only the <em>others</em> matter).</li><li>Confusing Pr(not call) with Pr(call).</li></ul>`,
  exam: R`${M.exam(R`<p>Not in supplied PYQs; lecture notes flag the formula $p^*=(C/V)^{1/(n-1)}$ as exam-relevant.</p>`)}` });

C({ id: 'mixed-interpret', week: 3, title: 'Interpreting mixed strategies', pri: 'Supporting',
  src: { notes: '✓ §3.6', text: '✓ Ch.7 §5', lec: '✓ W3_L4' }, prereq: ['mixed-strategy'],
  misShort: 'Assuming people literally flip coins in mixed equilibria.',
  intu: R`<p>Three readings: (1) <b>deliberate randomisation</b> (penalty kicks, audits — unpredictability is valuable); (2) <b>population shares</b>: a fraction of a population plays each action (Hawk–Dove in biology); (3) <b>beliefs</b>: the mix describes the uncertainty of the <em>other</em> player about my choice.</p>`,
  why: R`<ul><li>Helps explain odd comparative statics: changing my payoffs changes <em>your</em> equilibrium mix, not mine.</li></ul>`,
  formal: R`<p>In a mixed NE each player is indifferent among the actions in their support; nothing compels a particular mix except that it keeps the opponent indifferent.</p>`,
  math: R`<p><b>Comparative statics.</b> In the 100-trade drug game, raise the police payoff in (Street, Street) from 80 to 100. The police’s own mixing $p$ depends only on the dealer’s payoffs, so $p=5/13$ is unchanged; the dealer’s $q$ solves $100q=60-50q$ ⇒ $q=60/150=2/5$ (was 6/13).</p>`,
  ex: [
    { lvl: 'Introductory', t: 'Population view', q: R`<p>Interpret Hawk probability 0.9.</p>`, s: R`<p>90% of the population are aggressive types in a stable mix; no type does better than the other.</p>` },
    { lvl: 'Standard', t: 'Comparative statics', q: R`<p>In Matching Pennies, player 1’s winning payoff on (H,H) rises from 1 to 3. Whose mix changes?</p>`, s: R`<p>Player 2’s (to keep player 1 indifferent): $3q-(1-q)=-q+(1-q)\Rightarrow q=1/3$. Player 1 still mixes ½–½.</p>` },
    { lvl: 'Exam-level', t: 'Tax audits (course assignment theme)', q: R`<p>Why does a higher fine for cheating not necessarily reduce cheating in a mixed equilibrium of an audit game?</p>`, s: R`<p>The taxpayer’s cheating probability is pinned down by the auditor’s indifference (costs/benefits of auditing), not by the taxpayer’s own fine. A higher fine lowers the audit probability needed to keep taxpayers indifferent.</p>` }],
  conn: R`<p>See <a href="#/c/ne-interpret">NE interpretations</a>, <a href="#/c/indifference">indifference</a>.</p>`,
  mis: R`<ul><li>“Raising my payoff changes my mix” — no, it changes the opponent’s.</li></ul>`,
  exam: R`${M.exam(R`<p>Conceptual; supports reasoning checks in numeric PYQs.</p>`)}` });

/* ---------------- Week 3 checkpoints ---------------- */
Q({ id: 'cp-sol-relations-1', cp: 'sol-relations', week: 3, diff: 'Easy', cat: 'Conceptual', type: 'mcq', stem: R`If iterated elimination of strictly dominated strategies leaves exactly one profile, that profile is:`, opts: ['The unique Nash equilibrium', 'A Nash equilibrium, but others may exist', 'Not necessarily a Nash equilibrium', 'A dominant strategy equilibrium'], ans: 0, sol: R`<p>Every NE survives IESDS; only one profile survives; that profile is an NE.</p>`, why: ['Correct.', 'NE cannot be deleted by IESDS.', 'It is an NE.', 'Not necessarily (auction has no DSE).'] });
Q({ id: 'cp-sol-relations-2', cp: 'sol-relations', week: 3, diff: 'Moderate', cat: 'Conceptual', type: 'mcq', stem: R`An action is never a best response if and only if it is strictly dominated by a mixed strategy (finite two-player games).`, opts: ['True', 'False'], ans: 0, src: 'GA', sol: R`<p>The equivalence theorem.</p>`, why: ['Correct.', 'The theorem holds.'] });
Q({ id: 'cp-sol-relations-3', cp: 'sol-relations', week: 3, diff: 'Moderate', cat: 'Conceptual', type: 'msq', stem: R`Select all true statements.`, opts: ['Every SDSE is a Nash equilibrium', 'Every Nash equilibrium survives IESDS', 'Every Nash equilibrium survives IEWDS', 'A game can have no pure NE but a mixed NE'], ans: [0, 1, 3], sol: R`<p>IEWDS can delete NE; the rest are true.</p>`, why: ['True.', 'True.', 'False — IEWDS can delete NE.', 'True — Matching Pennies.'] });
Q({ id: 'cp-sol-relations-4', cp: 'sol-relations', week: 3, diff: 'Difficult', cat: 'Strategic reasoning', type: 'short', stem: R`Prove in a few lines that IESDS never eliminates a Nash equilibrium action.`, sol: R`<p>Suppose $a^*$ is an NE and $a_i^*$ is the first NE component deleted, by $a_i'$, when $a_{-i}^*$ is still available. Strict dominance gives $u_i(a_i',a_{-i}^*)>u_i(a_i^*,a_{-i}^*)$, contradicting that $a_i^*$ is a best response to $a_{-i}^*$.</p>` });

Q({ id: 'cp-zero-sum-1', cp: 'zero-sum', week: 3, diff: 'Easy', cat: 'Definitions', type: 'mcq', stem: R`A game where $u_1(a)+u_2(a)=100$ for every profile is:`, opts: ['Zero-sum', 'Constant-sum (strategically equivalent to zero-sum)', 'Cooperative', 'Not strictly competitive'], ans: 1, sol: R`<p>Constant-sum; subtracting 50 from each makes it zero-sum.</p>`, why: ['Sum is 100, not 0.', 'Correct.', 'Unrelated.', 'Constant-sum games are strictly competitive.'] });
Q({ id: 'cp-zero-sum-2', cp: 'zero-sum', week: 3, diff: 'Moderate', cat: 'Mixed strategies', type: 'num', stem: R`Rock–Paper–Scissors (win 1, lose −1, tie 0). In the NE, what is each player’s probability of playing Rock?`, ans: 1 / 3, tol: 0.01, ansText: '1/3', sol: R`<p>Unique NE (⅓,⅓,⅓).</p>` });
Q({ id: 'cp-zero-sum-3', cp: 'zero-sum', week: 3, diff: 'Moderate', cat: 'Conceptual', type: 'short', stem: R`Why is the value (expected payoff) of Rock–Paper–Scissors zero for both players in equilibrium?`, sol: R`<p>The game is symmetric and zero-sum: if one player’s equilibrium value were positive, the other’s would be negative, but the other could copy the same strategy and guarantee the same value by symmetry. So both values are 0 (directly: each pure action earns 0 against ⅓,⅓,⅓).</p>` });

Q({ id: 'cp-mixed-strategy-1', cp: 'mixed-strategy', week: 3, diff: 'Easy', cat: 'Mixed strategies', type: 'num', stem: R`Matching Pennies: $\Pr(H)=0.7$ for player 1, $0.4$ for player 2. Player 1’s expected payoff?`, ans: -0.08, sol: R`<p>$0.46(1)+0.54(-1)=-0.08$.</p>` });
Q({ id: 'cp-mixed-strategy-2', cp: 'mixed-strategy', week: 3, diff: 'Moderate', cat: 'Conceptual', type: 'mcq', stem: R`To verify a mixed profile is an NE, it suffices to check that no player gains by deviating to:`, opts: ['Any pure action', 'Only actions in the support', 'Only the opponent’s best response', 'Correlated strategies'], ans: 0, sol: R`<p>Linearity: mixed deviations are averages of pure ones.</p>`, why: ['Correct.', 'Must also check outside the support (exclusion rule).', 'Irrelevant.', 'Not part of NE.'] });
Q({ id: 'cp-mixed-strategy-3', cp: 'mixed-strategy', week: 3, diff: 'Moderate', cat: 'Mixed strategies', type: 'num', stem: R`BoS (3,1)/(0,0)/(0,0)/(1,3). Player 1’s expected payoff in the mixed NE?`, ans: 0.75, sol: R`<p>$q=1/4$; $U_1=3q=3/4$.</p>` });

Q({ id: 'cp-indifference-1', cp: 'indifference', week: 3, diff: 'Moderate', cat: 'Mixed strategies', type: 'mcq', stem: R`In a 2×2 mixed NE, player 1’s mixing probability is determined by:`, opts: ['Player 1’s own payoffs', 'Player 2’s payoffs', 'Both players’ payoffs equally', 'The social optimum'], ans: 1, sol: R`<p>Player 1 mixes to make player 2 indifferent.</p>`, why: ['Common error.', 'Correct.', 'Only the opponent’s payoffs.', 'Irrelevant.'], misc: 'Using own payoffs for own probabilities.' });
Q({ id: 'cp-indifference-2', cp: 'indifference', week: 3, diff: 'Moderate', cat: 'Mixed strategies', type: 'num', stem: R`(T,L)=(2,1), (T,R)=(0,3), (B,L)=(1,2), (B,R)=(3,0). Find $\Pr(T)$ in the mixed NE.`, ans: 0.5, sol: R`<p>No pure NE (row: L→T, R→B; col: T→R, B→L). P2 indifferent: $1p+2(1-p)=3p+0$ ⇒ $2-p=3p$ ⇒ $p=1/2$.</p>` });
Q({ id: 'cp-indifference-3', cp: 'indifference', week: 3, diff: 'Moderate', cat: 'Mixed strategies', type: 'num', stem: R`Same game. Find $\Pr(L)$ in the mixed NE.`, ans: 0.75, sol: R`<p>P1 indifferent: $2q=q+3(1-q)$ ⇒ $2q=3-2q$ ⇒ $q=3/4$.</p>` });
Q({ id: 'cp-indifference-4', cp: 'indifference', week: 3, diff: 'Difficult', cat: 'Mixed strategies', type: 'num', stem: R`Police/dealer, 200 trades: (Police, Dealer) Street-Street (150,50), Street-Park (0,200), Park-Street (50,150), Park-Park (100,100). Probability the police patrol the street?`, ans: 0.25, ansText: '1/4',
  sol: R`<p>No pure NE: police want to match, dealer to mismatch. Dealer indifferent: $U_D(S)=50p+150(1-p)=150-100p$, $U_D(P)=200p+100(1-p)=100+100p$ ⇒ $50=200p$ ⇒ $p=1/4$.</p>`, misc: 'Using the police’s own payoffs.' });
Q({ id: 'cp-indifference-5', cp: 'indifference', week: 3, diff: 'Moderate', cat: 'Strategic reasoning', type: 'short', stem: R`State the indifference principle and the exclusion rule, and explain why the second is needed.`, sol: R`<p>Indifference: every action played with positive probability earns the same (equilibrium) expected payoff. Exclusion: unused actions earn no more than that. Without the exclusion check, a profile could make a player indifferent between two actions while a third, unused action is strictly better — not an equilibrium.</p>` });

Q({ id: 'cp-br-graph-1', cp: 'br-graph', week: 3, diff: 'Moderate', cat: 'Mixed strategies', type: 'mcq', stem: R`A generic 2×2 game with two pure NE has how many NE in total?`, opts: ['2', '3', '4', 'Infinitely many'], ans: 1, sol: R`<p>The BR graphs also cross at an interior mixed point.</p>`, why: ['Misses the mixed NE.', 'Correct.', 'Generic count is odd.', 'Only in non-generic cases.'] });
Q({ id: 'cp-br-graph-2', cp: 'br-graph', week: 3, diff: 'Moderate', cat: 'Mixed strategies', type: 'mcq', stem: R`For the police in the 100-trade game, $B_P(q)$ (prob. of Street) equals:`, opts: ['1 if q > 6/13, 0 if q < 6/13, [0,1] at q = 6/13', '1 if q > 5/13 …', '0 if q > 6/13 …', 'Always 5/13'], ans: 0, sol: R`<p>Police prefer Street when the dealer is likely on the street: $80q>60-50q\iff q>6/13$.</p>`, why: ['Correct.', '5/13 is the police’s own equilibrium probability.', 'Reversed.', 'Confuses the BR with the NE value.'] });
Q({ id: 'cp-br-graph-3', cp: 'br-graph', week: 3, diff: 'Moderate', cat: 'Conceptual', type: 'short', stem: R`Sketch in words the BR graph of Matching Pennies and explain why it shows a unique NE.`, sol: R`<p>$B_1$: horizontal at p=0 for q<½, vertical segment at q=½, p=1 for q>½. $B_2$: q=1 for p<½, segment at p=½, q=0 for p>½. The “Z” and the reversed “Z” meet only at (½,½).</p>` });

Q({ id: 'cp-nash-existence-1', cp: 'nash-existence', week: 3, diff: 'Easy', cat: 'Conceptual', type: 'mcq', stem: R`Nash’s theorem guarantees that every finite game has:`, opts: ['A pure-strategy NE', 'At least one NE in mixed strategies', 'A unique NE', 'A dominant strategy equilibrium'], ans: 1, sol: R`<p>Existence in mixed strategies only.</p>`, why: ['Matching Pennies is a counter-example.', 'Correct.', 'BoS has three.', 'Rarely.'] });
Q({ id: 'cp-nash-existence-2', cp: 'nash-existence', week: 3, diff: 'Moderate', cat: 'Conceptual', type: 'mcq', stem: R`Which statement is correct?`, opts: ['Finiteness is necessary for existence of NE', 'Finiteness is sufficient but not necessary', 'Infinite games never have NE', 'Mixed NE exist only in zero-sum games'], ans: 1, sol: R`<p>Cournot etc. have NE with infinite action sets.</p>`, why: ['Cournot counter-example.', 'Correct.', 'False.', 'False.'] });
Q({ id: 'cp-nash-existence-3', cp: 'nash-existence', week: 3, diff: 'Moderate', cat: 'Strategic reasoning', type: 'short', stem: R`Give an example of a game with no Nash equilibrium and explain why Nash’s theorem does not apply.`, sol: R`<p>Each player names a number in [0,1); the higher wins. Any choice can be beaten, so no NE. The action set is infinite (and not compact), so the theorem’s finiteness assumption fails.</p>` });

Q({ id: 'cp-nbr-1', cp: 'nbr', week: 3, diff: 'Moderate', cat: 'Payoff matrix analysis', type: 'mcq', stem: R`Row payoffs vs X, Y: A (12, 0), B (11, 1), C (10, 4), D (9, 6). Which action is never a best response?`, opts: ['A', 'B', 'C', 'D'], ans: 1, sol: R`<p>B (1+10q) is always below max(12q, 6+3q); e.g. ¾A+¼D dominates it.</p>`, why: ['Best for q > 2/3.', 'Correct.', 'Best (tied) at q = 2/3.', 'Best for q < 2/3.'] });
Q({ id: 'cp-nbr-2', cp: 'nbr', week: 3, diff: 'Difficult', cat: 'Mixed strategies', type: 'num', stem: R`In the 4×2 lecture game, player 2 mixes with $q=\Pr(X)$ in every NE. Find $q$.`, ans: 2 / 3, tol: 0.005, ansText: '2/3', sol: R`<p>$12q=6+3q$ ⇒ $q=2/3$.</p>` });
Q({ id: 'cp-nbr-3', cp: 'nbr', week: 3, diff: 'Difficult', cat: 'Mixed strategies', type: 'num', stem: R`In the 4×2 game, the equilibrium mixtures of player 1 satisfy $3p+r=1$ ($p=\Pr(A)$, $r=\Pr(C)$). If $p=0.2$, what is $\Pr(D)$?`, ans: 0.4, sol: R`<p>$r=1-0.6=0.4$; $\Pr(D)=1-0.2-0.4=0.4$.</p>` });
Q({ id: 'cp-nbr-4', cp: 'nbr', week: 3, diff: 'Moderate', cat: 'Payoff matrix analysis', type: 'mcq', stem: R`War game: is player 2’s L (payoffs 1, 2, 2 vs U, M, D) strictly dominated by ½C + ½R (C: 6, 0, 4; R: 0, 5, 4)?`, opts: ['Yes', 'No — it ties against D', 'No — it loses against M', 'Only weakly'], ans: 0, sol: R`<p>Mixture gives (3, 2.5, 4) > (1, 2, 2).</p>`, why: ['Correct.', '4 > 2.', '2.5 > 2.', 'Strict everywhere.'] });

Q({ id: 'cp-bystander-1', cp: 'bystander', week: 3, diff: 'Moderate', cat: 'Mixed strategies', type: 'num', stem: R`Bystander model with $n=3$, $C/V=1/4$. Probability that a given witness does NOT call?`, ans: 0.5, sol: R`<p>$(1/4)^{1/2}=1/2$.</p>` });
Q({ id: 'cp-bystander-2', cp: 'bystander', week: 3, diff: 'Moderate', cat: 'Mixed strategies', type: 'num', stem: R`Same ($n=3$, $C/V=1/4$). Probability the crime is reported?`, ans: 0.875, sol: R`<p>$1-(1/2)^3=7/8$.</p>` });
Q({ id: 'cp-bystander-3', cp: 'bystander', week: 3, diff: 'Moderate', cat: 'Conceptual', type: 'mcq', stem: R`As the number of witnesses $n\to\infty$, the probability that the crime is reported:`, opts: ['Rises to 1', 'Falls to 0', 'Falls to $1-C/V$', 'Is unchanged'], ans: 2, sol: R`<p>$1-(C/V)^{n/(n-1)}\to1-C/V$.</p>`, why: ['Opposite.', 'Bounded below by 1 − C/V.', 'Correct.', 'It decreases with n.'] });
Q({ id: 'cp-bystander-4', cp: 'bystander', week: 3, diff: 'Difficult', cat: 'Strategic reasoning', type: 'short', stem: R`Why does the indifference condition use $p^{n-1}$ rather than $p^n$?`, sol: R`<p>Witness $i$ compares her own two actions given what the other $n-1$ witnesses do; her payoff from not calling depends on whether at least one of the <em>others</em> calls, which fails with probability $p^{n-1}$. Her own randomisation does not enter her conditional payoffs.</p>` });

Q({ id: 'cp-mixed-interpret-1', cp: 'mixed-interpret', week: 3, diff: 'Moderate', cat: 'Mixed strategies', type: 'num', stem: R`Drug game (100 trades) but police payoff on (Street, Street) becomes 100 (dealer payoffs unchanged). New probability that the dealer chooses Street?`, ans: 0.4, sol: R`<p>Police indifferent: $100q=10q+60(1-q)$ ⇒ $100q=60-50q$ ⇒ $q=0.4$. (Note: the Park–Street police payoff of 10 makes it $10q+60(1-q)=60-50q$.)</p>` });
Q({ id: 'cp-mixed-interpret-2', cp: 'mixed-interpret', week: 3, diff: 'Moderate', cat: 'Conceptual', type: 'mcq', stem: R`In the same change, the police’s own equilibrium probability of patrolling the street:`, opts: ['Rises', 'Falls', 'Is unchanged at 5/13', 'Becomes 1'], ans: 2, sol: R`<p>It is pinned down by the dealer’s payoffs, which did not change.</p>`, why: ['Own payoffs do not set own mix.', 'Own payoffs do not set own mix.', 'Correct.', 'Still no pure NE.'] });
Q({ id: 'cp-mixed-interpret-3', cp: 'mixed-interpret', week: 3, diff: 'Moderate', cat: 'Conceptual', type: 'short', stem: R`Give the “population” interpretation of the Hawk–Dove mixed equilibrium and explain why it is stable.`, sol: R`<p>90% Hawks, 10% Doves (v=10,k=6,d=4). At that mix both types earn the same average payoff; if Hawks became more common, Doves would do better (Hawks fight more), pushing the share back — a stable population state.</p>` });
Q({ id: 'cp-mixed-strategy-4', cp: 'mixed-strategy', week: 3, diff: 'Moderate', cat: 'Strategic reasoning', type: 'short', stem: R`Why do pure-strategy equilibria depend only on the ranking of payoffs, while mixed equilibria depend on their actual values?`, sol: R`<p>Pure NE compare payoffs of certain outcomes, which only needs the ordering. Mixed NE compare expected payoffs of lotteries; the indifference equations use the numbers themselves, which change under non-linear (though increasing) transformations.</p>` });
Q({ id: 'cp-nbr-5', cp: 'nbr', week: 3, diff: 'Difficult', cat: 'Strategic reasoning', type: 'short', stem: R`Why does the 4×2 lecture game have a continuum of equilibria rather than a single mixed equilibrium?`, sol: R`<p>At $q=2/3$ three of player 1’s actions (A, C, D) are simultaneously best responses. Player 2’s indifference gives only one equation, $3p+r=1$, in two unknowns, so a whole segment of player 1 mixtures keeps player 2 indifferent. Every point on it, paired with $q=2/3$, is an NE.</p>` });

/* ===================== WEEK 4 ===================== */
const PYQTREE = (pa, pc, pe, pf, hl) => M.tree({ p: 'P1', id: 'r', ch: [
  { a: 'A', hl: hl && hl.A, n: { pay: pa } },
  { a: 'B', hl: hl && hl.B, n: { p: 'P2', id: 'n2', ch: [
    { a: 'C', hl: hl && hl.C, n: { pay: pc } },
    { a: 'D', hl: hl && hl.D, n: { p: 'P1', id: 'n3', ch: [{ a: 'E', hl: hl && hl.E, n: { pay: pe } }, { a: 'F', hl: hl && hl.F, n: { pay: pf } }] } }] } }] }, { dx: 100 });

C({ id: 'tree', week: 4, title: 'Game trees (extensive form)', pri: 'High',
  src: { notes: '✓ §4.1', text: '✓ Ch.3 §1', lec: '✓ W4_L1, L2a' }, prereq: ['game-elements'],
  misShort: 'Counting decision nodes as terminal nodes, or forgetting the root.',
  intu: R`<p>When players move in turn and observe earlier moves, draw a tree: the root is the first decision; each branch is an action; each decision node is labelled with the player who moves; each <b>terminal node</b> (leaf) carries the payoff vector. Reading down a path tells the story of one play of the game.</p>`,
  why: R`<ul><li>The A/B–C/D–E/F tree comprehension appears in <b>all five</b> supplied papers (8 sub-questions each, ~10 marks).</li><li>Tree vocabulary (terminal nodes, information sets, subgames) is asked directly.</li></ul>`,
  formal: R`${M.def(R`<p>An <b>extensive-form game</b> with perfect information: players $N$; a set of histories $H$ (sequences of actions) with the empty history as root; terminal histories $Z$; a player function $P:H\setminus Z\to N$ telling who moves after each non-terminal history; payoffs $u_i:Z\to\mathbb R$.</p>`)}`,
  math: R`<p><b>PYQ tree</b> (2024 T2 / 2024 T3 / 2025 T2 / 2025 T3 payoffs):</p>${PYQTREE('(2,0)', '(3,1)', '(0,0)', '(1,2)')}<p>Decision nodes: 3 (P1 root, P2 after B, P1 after D). Terminal nodes: 4 (after A, C, E, F). Each decision node is a singleton information set → perfect information, 3 information sets.</p><p><b>Sequential PD (lecture):</b> histories $\{\emptyset,(C),(D),(C,C),(C,D),(D,C),(D,D)\}$; $P(\emptyset)=$ Ranga, $P(C)=P(D)=$ Billa.</p>`,
  ex: [
    { lvl: 'Introductory', t: 'Count nodes', q: R`<p>Count decision and terminal nodes in the PYQ tree.</p>`, s: R`<p>3 decision nodes, 4 terminal nodes (A, C, E, F endings).</p>` },
    { lvl: 'Standard', t: 'War game (bridge burning)', q: R`<p>Country 1: Attack (A) or Not (N → (5,3)). After A, Country 2: Retreat (R → (10,2)) or Fight (F → (0,1)). Draw and solve.</p>`, s: R`${M.tree({ p: 'C1', ch: [{ a: 'A', hl: true, n: { p: 'C2', ch: [{ a: 'R', hl: true, n: { pay: '(10,2)' } }, { a: 'F', n: { pay: '(0,1)' } }] } }, { a: 'N', n: { pay: '(5,3)' } }] })}<p>C2 retreats (2 > 1), so C1 attacks (10 > 5). If C2 <b>burns the bridge</b> (removes R), C2 must fight, and C1 then prefers N (5 > 0): commitment by limiting your own options.</p>` },
    { lvl: 'Exam-level', t: '2026 payoffs', q: R`<p>Draw the PYQ tree with A (2,0), C (3,2), E (2,1), F (1,2).</p>`, s: R`${PYQTREE('(2,0)', '(3,2)', '(2,1)', '(1,2)', { B: 1, C: 1, E: 1 })}<p>Highlighted: backward-induction choices (E at the last node, C for P2, B at the root).</p>` }],
  vis: R`${PYQTREE('(2,0)', '(3,1)', '(0,0)', '(1,2)', { A: 1, D: 1, F: 1 })}<div class="mcap">Highlighted edges = backward-induction choices for the 2024–25 payoffs: F, then D, then A.</div>`,
  conn: R`<p>Information in <a href="#/c/info-sets">information sets</a>; plans in <a href="#/c/ef-strategy">strategies</a>; solved by <a href="#/c/backward">backward induction</a>.</p>`,
  mis: R`<ul><li>Terminal nodes = number of payoff vectors (4), not number of moves.</li><li>Payoff order (P1, P2) stays the same even when P2 moves.</li></ul>`,
  exam: R`${M.exam(R`<p>Tree sub-questions in every paper: perfect info · 4 terminal nodes · 3 information sets · 4 and 2 strategies · # pure NE · SPE · 3 subgames.</p>`)}` });

C({ id: 'info-sets', week: 4, title: 'Information sets; perfect vs imperfect information', pri: 'High',
  src: { notes: '✓ §4.2', text: '✓ Ch.6 (combined)', lec: '✓ W4_L4' }, prereq: ['tree', 'classify'],
  misShort: 'Counting nodes in an information set as separate information sets.',
  intu: R`<p>An <b>information set</b> collects the decision nodes a player cannot tell apart when it is their turn. If a student cannot tell whether the bully has no knuckles or is hiding them, those two nodes are joined by a dotted line: one information set. If every set contains a single node, the game has perfect information.</p>`,
  why: R`<ul><li>“How many information sets does this game have?” — 3 in every PYQ tree.</li><li>Information sets define strategies and subgames.</li></ul>`,
  formal: R`${M.def(R`<p>An information set $I$ of player $i$ is a set of $i$’s decision nodes such that $i$ cannot distinguish them; the same actions must be available at every node of $I$. <b>Perfect information:</b> every information set is a singleton. A simultaneous-move game can be drawn as a tree where the second mover’s nodes form one information set.</p>`)}`,
  math: R`<p>Number of information sets = sum over players of their information sets. PYQ tree: P1 has $\{$root$\}$ and $\{$node after D$\}$, P2 has $\{$node after B$\}$: total 3.</p>${M.tree({ p: 'P1', ch: [{ a: 'U', n: { p: 'P2', id: 'a', ch: [{ a: 'L', n: { pay: '(2,1)' } }, { a: 'R', n: { pay: '(0,0)' } }] } }, { a: 'D', n: { p: 'P2', id: 'b', ch: [{ a: 'L', n: { pay: '(0,0)' } }, { a: 'R', n: { pay: '(1,2)' } }] } }] }, { info: [['a', 'b', 'P2 cannot observe']] })}<div class="mcap">A simultaneous 2×2 game as a tree: P2’s two nodes form one information set.</div>`,
  ex: [
    { lvl: 'Introductory', t: 'Count', q: R`<p>The simultaneous game above: how many information sets?</p>`, s: R`<p>2 (P1’s root; P2’s joined set).</p>` },
    { lvl: 'Standard', t: 'Bully game', q: R`<p>Bully: Show knuckles (K), Not show (NS), No knuckles (NK). Student sees K but cannot tell NS from NK. Student’s information sets?</p>`, s: R`<p>Two: $\{$after K$\}$ and $\{$after NS, after NK$\}$. Student’s strategies: $2\times2=4$.</p>` },
    { lvl: 'Exam-level', t: '3-player example (lecture)', q: R`<p>P1 at a; P2 at b and c in one information set; P3 at d and e separately. Count information sets and subgames.</p>`, s: R`<p>Information sets: {a}, {b,c}, {d}, {e} = 4. Subgames: the whole game, at d, at e = 3. b and c cannot start subgames (non-singleton information set).</p>` }],
  conn: R`<p>Determines <a href="#/c/ef-strategy">strategies</a> and <a href="#/c/subgame">subgames</a>; classification in <a href="#/c/classify">Week 1</a>.</p>`,
  mis: R`<ul><li>Perfect information ≠ complete information.</li><li>Different actions available at nodes in the same information set — impossible (the player would learn where they are).</li></ul>`,
  exam: R`${M.exam(R`<p>For a tree with no dotted lines: information sets = decision nodes.</p>`)}` });

C({ id: 'ef-strategy', week: 4, title: 'Strategies in extensive-form games', pri: 'High',
  src: { notes: '✓ §4.3', text: '✓ Ch.3 §1', lec: '✓ W4_L2a' }, prereq: ['action-strategy', 'info-sets'],
  misShort: 'Writing P1’s strategies as A, BE, BF (3) instead of AE, AF, BE, BF (4).',
  intu: R`<p>A strategy in a tree is a full instruction book: for every information set of yours, which action to take. Even if your first move ends the game, the book still says what you would do later.</p>`,
  why: R`<ul><li>PYQ: player 1 has 4, player 2 has 2 pure strategies (all papers).</li><li>Needed to convert trees to matrices.</li></ul>`,
  formal: R`${M.def(R`<p>$s_i:\mathcal H_i\to\bigcup A(I)$ with $s_i(I)\in A(I)$. $|S_i|=\prod_{I\in\mathcal H_i}|A(I)|$.</p>`)}`,
  math: R`<p>PYQ: P1: $\{A,B\}\times\{E,F\}$ → AE, AF, BE, BF. P2: {C, D}. Sequential PD: Billa has $2\times2=4$: CC, CD, DC, DD (first letter = reply to C, second = reply to D). Ultimatum with 5 offers: responder has $2^5=32$ strategies.</p>`,
  ex: [
    { lvl: 'Introductory', t: 'PYQ count', q: R`<p>List player 1’s strategies in the PYQ tree.</p>`, s: R`<p>AE, AF, BE, BF.</p>` },
    { lvl: 'Standard', t: 'Sequential PD', q: R`<p>Billa’s strategy “CD” means what?</p>`, s: R`<p>Confess if Ranga confessed; remain silent if Ranga stayed silent.</p>` },
    { lvl: 'Exam-level', t: 'Ultimatum', q: R`<p>Offers $x\in\{0,25,50,75,100\}$; responder accepts (Y) or rejects (N) each. How many responder strategies?</p>`, s: R`<p>$2^5=32$, e.g. NYYYY = reject 0, accept the rest.</p>` }],
  conn: R`<p>Used in <a href="#/c/ef-to-nf">conversion to normal form</a>, <a href="#/c/spe">SPE</a>.</p>`,
  mis: R`<ul><li>Omitting moves at unreached information sets.</li></ul>`,
  exam: R`${M.exam(R`<p>2 sub-questions per paper (1 mark each).</p>`)}` });

C({ id: 'backward', week: 4, title: 'Backward induction (rollback)', pri: 'High',
  src: { notes: '✓ §4.4', text: '✓ Ch.3 §2–3', lec: '✓ W4_L2b' }, prereq: ['tree', 'assumptions'],
  misShort: 'Starting at the root, or forgetting to record choices at off-path nodes.',
  intu: R`<p>Look forward, reason backward. Start at the last decisions, see what the mover would choose, replace that node with the resulting payoff, and repeat up the tree. At each step the mover anticipates rational play afterwards.</p>`,
  why: R`<ul><li>Gives the SPE in every finite perfect-information game (the PYQ “which NE is SPE?”).</li><li>Rules out non-credible threats.</li></ul>`,
  formal: R`${M.def(R`<p>In a finite game of perfect information, at each node whose successors are all terminal, the mover picks a payoff-maximising action; replace the node with that payoff; repeat until the root. The profile of choices at <em>all</em> nodes is the <b>rollback equilibrium</b>. (Kuhn/Zermelo: exists; unique if no player is ever indifferent.)</p>`)}`,
  math: R`<p><b>PYQ tree (A 2,0; C 3,1; E 0,0; F 1,2).</b></p><ol><li>P1 at last node: E gives 0, F gives 1 → <b>F</b>. Node value (1,2).</li><li>P2: C gives 1, D gives 2 (via F) → <b>D</b>. Node value (1,2).</li><li>P1 at root: A gives 2, B gives 1 → <b>A</b>.</li></ol><p>SPE $(AF,D)$; outcome A with (2,0).</p><p><b>2026 tree (A 2,0; C 3,2; E 2,1; F 1,2):</b> last node E (2 > 1) → value (2,1); P2: C (2) vs D (1) → C; root: A (2) vs B (3) → B. SPE $(BE,C)$, outcome (3,2).</p>`,
  ex: [
    { lvl: 'Introductory', t: '3-stage lecture game', q: R`<p>P1: B → (4,2) or A; P2: D → (3,5) or C; P1: E (5,6) or F (7,4). Solve.</p>`, s: R`<p>F (7 > 5) → value (7,4); P2: D (5 > 4); P1: B (4 > 3). Equilibrium (BF, D), outcome (4,2).</p>` },
    { lvl: 'Standard', t: 'Indifference', q: R`<p>P1: A or B. After A, P2: C (3,1) or D (1,1). After B, P2: E (2,5) or F (3,4). Solve.</p>`, s: R`<p>After B: E. After A: P2 indifferent. If C: P1 plays A → (A, CE). If D: P1 plays B → (B, DE). Two rollback equilibria.</p>` },
    { lvl: 'Exam-level', t: 'Entry game (2024 T2 Q244)', q: R`<p>Entrant: Enter or Not; incumbent: Accommodate or Fight. Ordinal payoffs: (E,A) = (2,1), (E,F) = (0,0), N = (1,2). SPE?</p>`, s: R`<p>Incumbent: A (1 > 0). Entrant: E (2 > 1). SPE <b>(E, A)</b>. (N, F) is an NE but relies on a non-credible threat.</p>` }],
  conn: R`<p>Equivalent to <a href="#/c/spe">SPE</a> in finite perfect-information games; requires <a href="#/c/assumptions">common knowledge of rationality</a>.</p>`,
  mis: R`<ul><li>Reporting only the path (A) instead of the full strategy (AF, D).</li><li>Using a later player’s payoff for an earlier player’s decision.</li></ul>`,
  exam: R`${M.exam(R`<p>The SPE sub-question offers (AE,D), (AF,D), (BE,C), (BF,C). The E/F choice at the unreached node decides between the first two.</p>`)}` });

C({ id: 'ef-to-nf', week: 4, title: 'Normal form of an extensive game; counting Nash equilibria', pri: 'High',
  src: { notes: '✓ §4.5', text: '✓ Ch.3 / Ch.6', lec: '✓ W4_L2c' }, prereq: ['ef-strategy', 'nash'],
  misShort: 'Forgetting that NE of the matrix can include non-credible threats (more NE than SPE).',
  intu: R`<p>Any tree can be rewritten as a matrix whose rows and columns are complete strategies. Pure Nash equilibria of that matrix are the NE of the tree — and there are usually more of them than backward induction gives, because the matrix cannot tell whether a threat would be carried out.</p>`,
  why: R`<ul><li>“How many pure-strategy NE does this game have?” — 3 (2024–25 papers) or 4 (2026).</li></ul>`,
  formal: R`<p>Rows = $S_1$, columns = $S_2$, each cell = payoff of the terminal node reached. Then find pure NE as usual.</p>`,
  math: R`<p><b>2024–25 tree.</b></p>${M.mat({ rows: ['AE', 'AF', 'BE', 'BF'], cols: ['C', 'D'], cells: [['2, 0', '2, 0'], ['2, 0', '2, 0'], ['3, 1', '0, 0'], ['3, 1', '1, 2']], br: true, ne: 'auto' })}<p>P1’s BRs: vs C → BE, BF; vs D → AE, AF. P2’s BRs: vs AE, AF → C or D (tie at 0); vs BE → C; vs BF → D. NE: <b>(BE,C), (AE,D), (AF,D)</b> — 3. SPE (AF,D) is one of them.</p>
  <p><b>2026 tree</b> (C (3,2), E (2,1), F (1,2)):</p>${M.mat({ rows: ['AE', 'AF', 'BE', 'BF'], cols: ['C', 'D'], cells: [['2, 0', '2, 0'], ['2, 0', '2, 0'], ['3, 2', '2, 1'], ['3, 2', '1, 2']], br: true, ne: 'auto' })}<p>P1 vs C → BE, BF; vs D → AE, AF, BE (all 2). P2 vs AE/AF → tie; vs BE → C; vs BF → tie (2 = 2). NE: <b>(BE,C), (BF,C), (AE,D), (AF,D)</b> — 4. SPE (BE,C).</p>`,
  ex: [
    { lvl: 'Introductory', t: 'Entry game matrix', q: R`<p>Matrix and NE of the entry game (E,A)=(2,1), (E,F)=(0,0), N=(1,2).</p>`, s: R`${M.mat({ rows: ['E', 'N'], cols: ['A', 'F'], cells: [['2, 1', '0, 0'], ['1, 2', '1, 2']], br: true, ne: 'auto' })}<p>NE: (E,A) and (N,F). Only (E,A) is SPE.</p>` },
    { lvl: 'Standard', t: 'Lecture example 6', q: R`<p>Tree: A → P2 chooses C (3,1) or D (1,1); B → P2 chooses E (2,5) or F (3,4). NE of the normal form?</p>`, s: R`${M.mat({ rows: ['A', 'B'], cols: ['CE', 'CF', 'DE', 'DF'], cells: [['3, 1', '3, 1', '1, 1', '1, 1'], ['2, 5', '3, 4', '2, 5', '3, 4']], br: true, ne: 'auto' })}<p>NE: (A,CE), (A,CF), (B,DE). (A,CF) is spurious: F after B is non-credible (4 < 5).</p>` },
    { lvl: 'Exam-level', t: 'Why AE and AF both appear', q: R`<p>Explain why (AE,D) is an NE but not SPE in the 2024 tree.</p>`, s: R`<p>Given D, P1 gets 2 from A and 0 from BE — A is optimal; given AE, P2 is indifferent (0 either way). So (AE,D) is NE. But AE says “choose E at the last node” — giving 0 < 1 from F — so it is not optimal in that subgame. Not SPE.</p>` }],
  conn: R`<p>Refined by <a href="#/c/spe">SPE</a>; built from <a href="#/c/ef-strategy">strategies</a>.</p>`,
  mis: R`<ul><li>Missing NE where a player is indifferent (P2 vs AE: C and D both 0).</li><li>Thinking every NE of the matrix is reasonable.</li></ul>`,
  exam: R`${M.exam(R`<p>Draw the 4×2 matrix; underline carefully including ties. 2024–25 answer 3, 2026 answer 4.</p>`)}` });

C({ id: 'subgame', week: 4, title: 'Subgames', pri: 'High',
  src: { notes: '✓ §4.6', text: '✓ Ch.6 §2', lec: '✓ W4_L4' }, prereq: ['info-sets'],
  misShort: 'Forgetting that the whole game is itself a subgame.',
  intu: R`<p>A subgame is a piece of the tree that could be played as a game on its own: it starts at a node the mover knows exactly, includes everything after it, and does not cut through any information set.</p>`,
  why: R`<ul><li>“No. of subgames” — 3 in the PYQ tree.</li><li>SPE requires NE in every subgame.</li></ul>`,
  formal: R`${M.def(R`<p>A <b>subgame</b> starting at decision node $x$ consists of $x$ and all its successors, provided (i) $x$ is a singleton information set, (ii) every information set containing a successor of $x$ lies entirely within the successors of $x$. The whole game is a subgame (a subgame that is not the whole game is a <b>proper</b> subgame).</p>`)}`,
  math: R`<p>In perfect-information games every decision node starts a subgame, so #subgames = #decision nodes. PYQ tree: 3 decision nodes ⇒ <b>3 subgames</b> (whole game, after B, after D). Proper subgames: 2.</p>`,
  ex: [
    { lvl: 'Introductory', t: 'Entry game', q: R`<p>How many subgames in the entry game?</p>`, s: R`<p>2: the whole game and the incumbent’s node.</p>` },
    { lvl: 'Standard', t: 'Simultaneous game as tree', q: R`<p>A simultaneous 2×2 game drawn as a tree. Subgames?</p>`, s: R`<p>Only 1 (the whole game): P2’s nodes form one information set, so neither starts a subgame.</p>` },
    { lvl: 'Exam-level', t: 'Lecture example 12', q: R`<p>P1 chooses U or D (D → (2,2)); after U, P1 (x/y) and P2 (a/b) move simultaneously. Subgames?</p>`, s: R`<p>2: the whole game and the simultaneous subgame after U.</p>` }],
  conn: R`<p>Basis of <a href="#/c/spe">SPE</a>.</p>`,
  mis: R`<ul><li>Counting terminal nodes as subgames.</li><li>Starting a subgame inside a non-singleton information set.</li></ul>`,
  exam: R`${M.exam(R`<p>Answer 3 (counting the whole game). The option “2” is the count of proper subgames — a trap.</p>`)}` });

C({ id: 'spe', week: 4, title: 'Subgame-perfect equilibrium & credible threats', pri: 'High',
  src: { notes: '✓ §4.7', text: '✓ Ch.3 §3, Ch.6 §3', lec: '✓ W4_L5' }, prereq: ['subgame', 'backward', 'ef-to-nf'],
  misShort: 'Accepting an NE that relies on a threat the player would not carry out.',
  intu: R`<p>Some Nash equilibria are held together by threats that would never be executed: “If you enter, I’ll start a price war.” If entry actually happened, fighting would hurt the incumbent too, so the threat isn’t credible. <b>Subgame perfection</b> demands rational play in every subgame, including those not reached — eliminating such threats.</p>`,
  why: R`<ul><li>Every paper asks “which NE is also an SPE?” plus the entry-game SPE.</li></ul>`,
  formal: R`${M.def(R`<p>(Selten) A strategy profile $s^*$ is a <b>subgame-perfect equilibrium</b> if its restriction to every subgame is a Nash equilibrium of that subgame. In finite perfect-information games, SPE = backward-induction profiles.</p>`)}`,
  math: R`<p><b>Recipe with imperfect information:</b> solve the smallest subgames first (find their NE, possibly via a matrix), replace them by their equilibrium payoffs, move up. If a subgame has several NE, each gives a different SPE.</p><p><b>Lecture example 12.</b> After U: (x,a)=(1,3), (x,b)=(0,0), (y,a)=(0,0), (y,b)=(3,1); D → (2,2). Subgame NE: (x,a) and (y,b). If (x,a): P1 compares 1 (U) vs 2 (D) → D: SPE (Dx, a). If (y,b): 3 vs 2 → U: SPE (Uy, b). Full-game pure NE: (Uy,b), (Dx,a), (Dy,a); (Dy,a) is not SPE (a is not a best response to y in the subgame). NotebookLM lists “(dy, b)” as an NE — that is wrong (P1 deviates to Uy); flagged.</p>`,
  ex: [
    { lvl: 'Introductory', t: 'Entry deterrence', q: R`<p>Why is (N, F) not subgame perfect?</p>`, s: R`<p>In the subgame after entry, F gives the incumbent 0 < 1 from A. F is not an NE of that subgame, so the threat is non-credible.</p>` },
    { lvl: 'Standard', t: 'PYQ SPE (2024–25)', q: R`<p>Which of (AE,D), (AF,D), (BE,C) is SPE?</p>`, s: R`<p>(AF,D) — backward induction gives F, then D, then A.</p>` },
    { lvl: 'Exam-level', t: 'PYQ SPE (2026)', q: R`<p>With C (3,2), E (2,1), F (1,2): which of the four NE is SPE?</p>`, s: R`<p>(BE,C). (BF,C) fails at the last node (F gives 1 < 2); (AE,D) and (AF,D) fail at P2’s node (D gives 1 < 2 given E).</p>` }],
  conn: R`<p>Refines <a href="#/c/nash">NE</a>; computed by <a href="#/c/backward">backward induction</a>; applications in <a href="#/c/ef-apps">Week 4 applications</a>.</p>`,
  mis: R`<ul><li>SPE is a full strategy profile, not just the equilibrium path.</li><li>An NE that yields the same outcome as the SPE may still fail to be SPE (AE,D vs AF,D).</li></ul>`,
  exam: R`${M.exam(R`<p>2 marks per paper + entry-game item (2024 T2). Always verify optimality at the off-path node.</p>`)}` });

C({ id: 'ef-apps', week: 4, title: 'Applications: ultimatum, divide-and-choose, agenda setting, Stackelberg, commitment', pri: 'Medium',
  src: { notes: '✓ §4.8', text: '✓ Ch.3 §4–6', lec: '✓ W4_L1, L3, L5' }, prereq: ['backward', 'spe'],
  misShort: 'Assuming the responder in the ultimatum game must receive a fair share in SPE.',
  intu: R`<p>Sequential structure creates power: the first mover can shape the second mover’s options (ultimatum, Stackelberg), a designer can choose the order of votes to engineer an outcome (agenda setting), and a player can gain by <em>removing</em> their own options (burning bridges).</p>`,
  why: R`<ul><li>Course examples; Stackelberg in the Week 4 assignment; entry deterrence in 2024 T2.</li></ul>`,
  formal: R`<ul><li><b>Ultimatum:</b> P1 offers $x$ to P2; P2 accepts (split $(100-x,x)$) or rejects (0,0).</li><li><b>Divide and choose:</b> kid 1 cuts $(x,1-x)$; kid 2 picks a piece.</li><li><b>Agenda setting:</b> pairwise majority votes in a chosen order.</li><li><b>Stackelberg:</b> firm 1 picks $q_1$; firm 2 observes and picks $q_2$.</li></ul>`,
  math: R`<p><b>Ultimatum (offers 0, 25, 50, 75, 100):</b> If P2 accepts every offer (YYYYY), P1 offers 0 → (100, 0). If P2 rejects only 0 (NYYYY, indifferent at 0), P1 offers 25 → (75, 25). Both are rollback equilibria (P2 is indifferent at 0).</p><p><b>Divide and choose:</b> kid 2 takes the larger piece, so kid 1 gets $\min(x,1-x)$, maximised at $x=\tfrac12$.</p><p><b>Agenda setting:</b> voters 1: A ≻ B ≻ C; 2: B ≻ C ≻ A; 3: C ≻ A ≻ B (Condorcet cycle). To elect A: first B vs C (B wins), then B vs A (A wins). To elect B: A vs C first (C wins), then C vs B (B wins).</p><p><b>Stackelberg</b> with $P=a-Q$, cost $c$: follower $q_2=(a-c-q_1)/2$. Leader maximises $q_1(a-c-q_1)/2$ ⇒ $q_1=(a-c)/2$, $q_2=(a-c)/4$. The leader produces more and earns more than in Cournot ($(a-c)^2/8$ vs $(a-c)^2/9$).</p>`,
  ex: [
    { lvl: 'Introductory', t: 'Divide and choose', q: R`<p>Why does kid 1 cut evenly?</p>`, s: R`<p>Kid 2 will take the bigger piece; kid 1 maximises the smaller piece ⇒ ½–½.</p>` },
    { lvl: 'Standard', t: 'Stackelberg numbers', q: R`<p>$P=12-Q$, $c=0$. Stackelberg quantities and profits?</p>`, s: R`<p>$q_1=6$, $q_2=3$, $P=3$, $\pi_1=18$, $\pi_2=9$ (Cournot: 4, 4, profits 16 each).</p>` },
    { lvl: 'Exam-level', t: 'Agenda manipulation', q: R`<p>Which agenda elects C?</p>`, s: R`<p>First A vs B (A wins: voters 1, 3), then A vs C (C wins: voters 2, 3).</p>` }],
  conn: R`<p>Applications of <a href="#/c/backward">backward induction</a> and <a href="#/c/spe">SPE</a>; Stackelberg vs <a href="#/c/cournot">Cournot</a>.</p>`,
  mis: R`<ul><li>Ultimatum: SPE gives the proposer (almost) everything; experiments differ (fairness), but that is not the SPE prediction.</li><li>First-mover advantage is not universal (in Matching Pennies, moving first is a disadvantage).</li></ul>`,
  exam: R`${M.exam(R`<p>Expect the entry-game style: model with ordinal payoffs, find SPE.</p>`)}` });

/* ---------------- Week 4 checkpoints ---------------- */
Q({ id: 'cp-tree-1', cp: 'tree', week: 4, diff: 'Easy', cat: 'Extensive-form', type: 'num', stem: R`P1 chooses L or R; after L the game ends; after R, P2 chooses a, b or c, and the game ends. How many terminal nodes?`, ans: 4, sol: R`<p>1 (after L) + 3 (after a, b, c) = 4.</p>` });
Q({ id: 'cp-tree-2', cp: 'tree', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'mcq', stem: R`In the bridge-burning war game, why does Country 2 benefit from burning the bridge?`, opts: ['It raises its payoff from fighting', 'It removes the Retreat option, making the threat to fight credible, which deters attack', 'It forces Country 1 to retreat', 'It changes the game to simultaneous moves'], ans: 1, sol: R`<p>With only F available, C1 anticipates (0,1) and chooses N, giving C2 3 > 2.</p>`, why: ['Payoffs are unchanged.', 'Correct.', 'C1 never attacks.', 'Still sequential.'] });
Q({ id: 'cp-tree-3', cp: 'tree', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'short', stem: R`Explain the difference between a decision node and a terminal node, and say what is attached to each.`, sol: R`<p>A decision node is a point where a named player chooses among actions (branches). A terminal node ends the game and carries the payoff vector (one payoff per player, P1 first).</p>` });

Q({ id: 'cp-info-sets-1', cp: 'info-sets', week: 4, diff: 'Easy', cat: 'Extensive-form', type: 'mcq', stem: R`A simultaneous-move 2×2 game drawn as a tree has how many information sets?`, opts: ['1', '2', '3', '4'], ans: 1, sol: R`<p>P1’s root, plus P2’s two nodes joined into one.</p>`, why: ['Each player has at least one.', 'Correct.', 'P2’s nodes are one set.', 'Not 4.'] });
Q({ id: 'cp-info-sets-2', cp: 'info-sets', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'num', stem: R`Bully game: the student observes K but cannot distinguish NS from NK, and chooses R or NR. How many pure strategies does the student have?`, ans: 4, sol: R`<p>2 information sets × 2 actions = 4.</p>` });
Q({ id: 'cp-info-sets-3', cp: 'info-sets', week: 4, diff: 'Moderate', cat: 'Conceptual', type: 'mcq', stem: R`Which must hold for all nodes in one information set?`, opts: ['Same player to move and same set of available actions', 'Same payoffs', 'Same number of successors leading to terminal nodes', 'They are at the same depth in the tree'], ans: 0, sol: R`<p>Otherwise the player could tell the nodes apart.</p>`, why: ['Correct.', 'Payoffs can differ.', 'Not required.', 'Not required (but typical).'] });

Q({ id: 'cp-ef-strategy-1', cp: 'ef-strategy', week: 4, diff: 'Easy', cat: 'Extensive-form', type: 'num', stem: R`Sequential PD: Ranga moves (C/D), Billa observes and moves (C/D). How many pure strategies does Billa have?`, ans: 4, sol: R`<p>$2^2=4$: CC, CD, DC, DD.</p>` });
Q({ id: 'cp-ef-strategy-2', cp: 'ef-strategy', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'num', stem: R`Ultimatum game with offers {0,25,50,75,100}; responder accepts or rejects each. Number of responder strategies?`, ans: 32, sol: R`<p>$2^5=32$.</p>` });
Q({ id: 'cp-ef-strategy-3', cp: 'ef-strategy', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'mcq', stem: R`In the PYQ tree, which is NOT a pure strategy of player 1?`, opts: ['AE', 'BF', 'A', 'AF'], ans: 2, sol: R`<p>“A” alone does not specify the action at the second information set.</p>`, why: ['A strategy.', 'A strategy.', 'Correct.', 'A strategy.'] });

Q({ id: 'cp-backward-1', cp: 'backward', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'mcq', stem: R`3-stage game: P1: B → (4,2) or A; P2: D → (3,5) or C; P1: E (5,6) or F (7,4). Backward-induction profile:`, opts: ['(BF, D)', '(AF, C)', '(BE, D)', '(AE, C)'], ans: 0, sol: R`<p>F, then D (5 > 4), then B (4 > 3).</p>`, why: ['Correct.', 'P2 would choose D.', 'E is not optimal at the last node.', 'Neither E nor C is optimal.'] });
Q({ id: 'cp-backward-2', cp: 'backward', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'num', stem: R`PYQ tree with A (2,0), C (3,1), E (0,0), F (1,2). What is player 1’s payoff on the backward-induction path?`, ans: 2, sol: R`<p>Outcome A: (2,0).</p>` });
Q({ id: 'cp-backward-3', cp: 'backward', week: 4, diff: 'Difficult', cat: 'Extensive-form', type: 'mcq', stem: R`PYQ tree with A (2,0), C (1,1), E (0,0), F (3,2). SPE?`, opts: ['(AF, D)', '(BF, D)', '(BE, C)', '(AE, C)'], ans: 1, sol: R`<p>F (3 > 0) → (3,2); P2: D (2 > 1); P1: B (3 > 2). SPE (BF, D).</p>`, why: ['P1 prefers B (3 > 2).', 'Correct.', 'E not optimal.', 'Neither E nor C.'] });
Q({ id: 'cp-backward-4', cp: 'backward', week: 4, diff: 'Moderate', cat: 'Strategic reasoning', type: 'short', stem: R`What does backward induction assume about players’ knowledge, and why can it fail in long games (e.g. centipede-type games)?`, sol: R`<p>It assumes common knowledge of rationality: each mover expects all later movers to be rational and to expect the same of others. In long games this requires very deep reasoning; a single observed “irrational” move may lead others to doubt rationality, and experiments show players continue longer than predicted.</p>` });

Q({ id: 'cp-ef-to-nf-1', cp: 'ef-to-nf', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'num', stem: R`Entry game: (E,A) = (2,1), (E,F) = (0,0), N = (1,2). How many pure-strategy NE?`, ans: 2, sol: R`<p>(E,A) and (N,F).</p>` });
Q({ id: 'cp-ef-to-nf-2', cp: 'ef-to-nf', week: 4, diff: 'Difficult', cat: 'Extensive-form', type: 'num', stem: R`PYQ tree with A (2,0), C (1,1), E (0,0), F (3,2). Number of pure-strategy NE of its normal form?`, ans: 3,
  sol: R`<p>Matrix: AE (2,0),(2,0); AF (2,0),(2,0); BE (1,1),(0,0); BF (1,1),(3,2). P1 BR vs C: AE, AF (2 > 1); vs D: BF (3). P2 BR vs AE/AF: C or D (tie); vs BE: C; vs BF: D. NE: (AE,C), (AF,C), (BF,D) — <b>3</b>. Only (BF,D) is subgame perfect.</p>`, misc: 'Missing NE where the column player is indifferent.' });
Q({ id: 'cp-ef-to-nf-3', cp: 'ef-to-nf', week: 4, diff: 'Moderate', cat: 'Conceptual', type: 'mcq', stem: R`Why can the normal form of a sequential game have more Nash equilibria than backward induction gives?`, opts: ['The matrix loses information about payoffs', 'NE does not require optimal behaviour at unreached nodes, so non-credible threats survive', 'Mixed strategies are added', 'The matrix changes the order of moves'], ans: 1, sol: R`<p>Off-path choices do not affect payoffs on the path, so NE does not discipline them.</p>`, why: ['Payoffs are preserved.', 'Correct.', 'Pure NE only here.', 'Order is encoded in strategies.'] });

Q({ id: 'cp-subgame-1', cp: 'subgame', week: 4, diff: 'Easy', cat: 'Extensive-form', type: 'num', stem: R`A perfect-information tree has 5 decision nodes. How many subgames does it have (including the whole game)?`, ans: 5, sol: R`<p>Every decision node starts a subgame in perfect-information games.</p>` });
Q({ id: 'cp-subgame-2', cp: 'subgame', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'mcq', stem: R`Which node can NOT start a subgame?`, opts: ['The root', 'A node in a singleton information set whose successors’ information sets are all contained below it', 'A node belonging to a two-node information set', 'The last decision node in a perfect-information game'], ans: 2, sol: R`<p>Subgames must start at singleton information sets.</p>`, why: ['The root always does.', 'That satisfies the definition.', 'Correct.', 'It starts a subgame.'] });
Q({ id: 'cp-subgame-3', cp: 'subgame', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'num', stem: R`Lecture 3-player game: P1 at a; P2 at b and c in one information set; P3 at d and e in separate sets. Number of subgames?`, ans: 3, sol: R`<p>Whole game, at d, at e.</p>` });

Q({ id: 'cp-spe-1', cp: 'spe', week: 4, diff: 'Easy', cat: 'Extensive-form', type: 'mcq', stem: R`A subgame-perfect equilibrium is a strategy profile that:`, opts: ['Is a Nash equilibrium of the whole game only', 'Induces a Nash equilibrium in every subgame', 'Maximises total payoff', 'Is a dominant strategy equilibrium'], ans: 1, sol: R`<p>Selten’s definition.</p>`, why: ['That is just NE.', 'Correct.', 'Efficiency is irrelevant.', 'Not required.'] });
Q({ id: 'cp-spe-2', cp: 'spe', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'msq', stem: R`Lecture example 12 (U → simultaneous subgame with (x,a)=(1,3), (x,b)=(0,0), (y,a)=(0,0), (y,b)=(3,1); D → (2,2)). Select all pure SPE.`, opts: ['(Uy, b)', '(Dx, a)', '(Dy, a)', '(Ux, a)'], ans: [0, 1], sol: R`<p>Subgame NE (x,a) → P1 picks D: (Dx,a). Subgame NE (y,b) → P1 picks U: (Uy,b). (Dy,a) is NE of the whole game but (y,a) is not an NE of the subgame. (Ux,a) is not optimal at the root (1 < 2).</p>`, why: ['SPE.', 'SPE.', 'Not NE in the subgame.', 'U gives 1 < 2.'] });
Q({ id: 'cp-spe-3', cp: 'spe', week: 4, diff: 'Moderate', cat: 'Strategic reasoning', type: 'short', stem: R`Define a non-credible threat with an example, and explain how SPE removes it.`, sol: R`<p>A threat to take an action that would not be optimal if the situation actually arose — e.g. the incumbent “will fight if you enter” when fighting gives 0 < 1 from accommodating. (Stay out, Fight) is an NE because the threat is never tested. SPE requires optimal play in the post-entry subgame, so F is replaced by A and the entrant enters.</p>` });

Q({ id: 'cp-ef-apps-1', cp: 'ef-apps', week: 4, diff: 'Moderate', cat: 'Continuous games', type: 'num', stem: R`Stackelberg: $P=12-Q$, zero cost. Leader’s output?`, ans: 6, sol: R`<p>$q_1=(a-c)/2=6$.</p>` });
Q({ id: 'cp-ef-apps-2', cp: 'ef-apps', week: 4, diff: 'Moderate', cat: 'Extensive-form', type: 'mcq', stem: R`Ultimatum game, offers {0,25,50,75,100}. If the responder rejects 0 and accepts everything else, the proposer offers:`, opts: ['0', '25', '50', '100'], ans: 1, sol: R`<p>The smallest accepted offer.</p>`, why: ['Rejected.', 'Correct.', 'Unnecessarily generous.', 'Not optimal.'] });
Q({ id: 'cp-ef-apps-3', cp: 'ef-apps', week: 4, diff: 'Moderate', cat: 'Strategic reasoning', type: 'mcq', stem: R`Voters 1: A≻B≻C, 2: B≻C≻A, 3: C≻A≻B, sincere pairwise voting. Agenda “first A vs B, then winner vs C” elects:`, opts: ['A', 'B', 'C', 'Tie'], ans: 2, sol: R`<p>A beats B (1, 3); C beats A (2, 3).</p>`, why: ['A loses to C.', 'B is out first.', 'Correct.', 'Majorities are strict with 3 voters.'] });
Q({ id: 'cp-ef-apps-4', cp: 'ef-apps', week: 4, diff: 'Moderate', cat: 'Strategic reasoning', type: 'short', stem: R`Why does the Stackelberg leader produce more than in Cournot?`, sol: R`<p>Commitment: the leader knows the follower’s best response falls as $q_1$ rises, so producing more pushes the follower to produce less. Taking this into account the leader expands to $(a-c)/2$ (vs $(a-c)/3$), earning higher profit.</p>` });
Q({ id: 'cp-info-sets-4', cp: 'info-sets', week: 4, diff: 'Moderate', cat: 'Strategic reasoning', type: 'short', stem: R`Why must every node in an information set offer the same actions to the mover?`, sol: R`<p>If the available actions differed, the mover could infer which node she is at simply by looking at her options — contradicting the assumption that she cannot distinguish the nodes.</p>` });
Q({ id: 'cp-ef-strategy-4', cp: 'ef-strategy', week: 4, diff: 'Moderate', cat: 'Strategic reasoning', type: 'short', stem: R`In the sequential PD, Billa has 4 strategies. Which of them is part of the backward-induction solution, and why is “CD” not?`, sol: R`<p>Backward induction: after either move by Ranga, Billa confesses (0 > −1 and −5 > −20), so his strategy is CC. CD (silent after Ranga is silent) is not optimal in the subgame after D, since confessing there gives 0 > −1.</p>` });
Q({ id: 'cp-ef-to-nf-4', cp: 'ef-to-nf', week: 4, diff: 'Moderate', cat: 'Strategic reasoning', type: 'short', stem: R`Converting a tree to a matrix keeps all payoffs. What information is lost, and why does it matter?`, sol: R`<p>The timing and the observation structure: the matrix does not show that a later mover would react after seeing an earlier move. As a result, NE of the matrix may include threats at unreached nodes that would not be carried out (non-credible), which SPE removes.</p>` });
Q({ id: 'cp-subgame-4', cp: 'subgame', week: 4, diff: 'Moderate', cat: 'Strategic reasoning', type: 'short', stem: R`Why can a subgame not start at a node inside a non-singleton information set?`, sol: R`<p>A subgame must be a well-defined game on its own; its first mover must know where she is. Starting inside a multi-node information set would require the player to know which node was reached, which she does not — and the subgame would split an information set.</p>` });

/* ===================== PREVIOUS-YEAR QUESTIONS (PYQ) =====================

   Stems/options are transcribed verbatim from the text layer; where the paper shows the stem
   or options only as an image, the transcription was made from the rendered page (keyNote says so).
   Official keys = green ticks / "Possible Answers" in the papers; every key was re-derived independently. */

const IMG = 'Stem/options appear as an image in the supplied paper; transcribed from the rendered page.';

const AUC_TXT = (v1, v2) => R`<p>An item is up for auction. Player 1 values the item at ${v1} while player 2 values the item at ${v2}. Each player can bid either 0, 1 or 2. If player i bids more than player j then i wins the good and pays his bid, while the loser does not pay. If both players bid the same amount, then a coin is tossed to determine who the winner is, who gets the good and pays his bid while the loser pays nothing. Formulate the game in matrix form and answer the given subquestions.</p>`;
const CTX = {
  auc35: AUC_TXT(3, 5), auc54: AUC_TXT(5, 4),
  hawk: R`<p>(Hawk-Dove) The following game has been widely used in evolutionary biology to understand how "fighting" and "display" strategies by animals could coexist in a population. For a typical Hawk-Dove game there are resources to be gained (i.e. food, mates, territories, etc.) denoted as v. Each of two players can chooses to be aggressive, called "Hawk" (H), or can be compromising, called "Dove" (D). If both players choose H then they split the resources, but loose some payoff from injuries, denoted as k. Assume that k &gt; v/2. If both choose D then they split the resources, but engage in some display of power that a display cost d, with d &lt; v/2. Finally, if player i chooses H while j chooses D, then i gets all the resources while j leaves with no benefits and no costs. Describe the game as a game matrix and answer the following question.</p>`,
  drug: n => R`<p>Determined to crack down on the drug trade, a city mayor puts more officers out on patrol to disrupt the business of drug dealers. A drug dealer in a neighborhood can work his trade either on a street corner or in the park. Each day, he decides where to set up shop, knowing that word about his location will travel among users. Because a good snitch is lacking, word does not travel to the police. The police officer on the beat then needs to decide whether she will patrol the park or the street corner, while not knowing where the drug dealer is hanging out that day. The decision of the officer and the dealer determine the extent of drug trades that day. Let suppose the total number of potential trades in the market is ${n}. A dealer's payoff is determined by the number of trades he consummates, while the officer's payoff is based on the number of trades she disrupts. The table below illustrates the payoffs for both parties according to their respective strategies in the game.</p>` +
    (n === 100 ? M.mat({ rows: ['Street', 'Park'], cols: ['Street', 'Park'], cells: [['80, 20', '0, 100'], ['10, 90', '60, 40']], rp: 'Police officer', cp: 'Drug dealer', br: false, cap: 'Table (shown as an image in the paper): payoffs (Police, Dealer).' })
      : M.mat({ rows: ['Street', 'Park'], cols: ['Street', 'Park'], cells: [['400, 100', '0, 500'], ['100, 400', '300, 200']], rp: 'Police officer', cp: 'Drug dealer', br: false, cap: 'Table (shown as an image in the paper): payoffs (Police, Dealer).' })),
  tree: (pc, pe, pf) => R`<p>Consider a two-player game in which player 1 can choose A or B. The game ends if he chooses A while it continues to player 2 if he chooses B. Player 2 can either choose C or D, with the game ending after C and continuing again with player 1 after D. Player 1 then can choose E or F, and then the game ends after each of these choices.</p><p>Imagine that the payoffs following choice A by player 1 are (2, 0), following C by player 2 are ${pc}, following E by player 1 are ${pe} and following F by player 1 are ${pf}</p><p>Model this as an extensive form game and answer the given subquestions:</p>`,
  braess: R`<p>(Choosing a route) Four people must drive from A to B at the same time. Two routes are available, one via X and one via Y (Refer to the left panel of following Figure). The roads from A to X, and from Y to B are both short and narrow; in each case, one car takes 6 minutes, and each additional car increases the travel time per car by 3 minutes. (If two cars drive from A to X, for example, each car takes 9 minutes.) The roads from A to Y, and from X to B are long and wide; on A to Y one car takes 20 minutes, and each additional car increases the travel time per car by 1 minute; on X to B one car takes 20 minutes, and each additional car increases the travel time per car by 0.9 minutes. Formulate this situation as a strategic game and answer the given subquestions.</p>${M.net({ ax: '6,9,12,15', xb: '20,20.9,21.8,22.7', ay: '20,21,22,23', yb: '6,9,12,15' }, { cap: 'Original network (times for 1, 2, 3, 4 cars).' })}`,
  braess2: R`<p>Now suppose that a relatively short, wide road is built from X to Y, giving each person four options for travel from A to B: A–X–B, A–Y–B, A–X–Y–B, and A–Y–X–B (As shown in the right panel of the given figure). Assume that a person who takes A–X–Y–B travels the A–X portion at the same time as someone who takes A–X–B, and the Y–B portion at the same time as someone who takes A–Y–B. (Think of there being constant flows of traffic.) On the road between X and Y, one car takes 7 minutes and each additional car increases the travel time per car by 1 minute. Find the Nash equilibrium in this new situation.</p>${M.net({ ax: '6,9,12,15', xb: '20,20.9,21.8,22.7', ay: '20,21,22,23', yb: '6,9,12,15', xy: '7,8,9,10' }, { cap: 'Network with new road from X to Y.' })}`,
  syn: c => R`<p>(Synergies) Two division managers can invest time and effort in creating a better working relationship. Each invests $e_i\ge0$, and if both invest more then both are better off, but it is costly for each manager to invest. In particular, the payoff function for player $i$ from effort levels $(e_i,e_j)$ is $v_i(e_i,e_j)=(a+e_j)e_i-${c}e_i^2$.</p><p>Based on the above data, answer the given subquestions.</p>`,
  bert: R`<p>Consider a duopoly game in which two firms simultaneously and independently select prices that are greater than or equal to zero. Denote firm 1’s price as $P_1$ and firm 2’s price as $P_2$. After the prices are set, consumers demand $10-P_1+P_2$ units of the good that firm 1 produces, and they demand $10-P_2+P_1$ units of the good that firm 2 produces. Assume that each firm produces at zero cost, so firm $i$’s payoff (profit) is $(10-P_i+P_j)P_i$, where $P_i$ is firm $i$’s price and $P_j$ is the other firm’s price. Answer the given sub questions based on this information:</p>`,
  g25: R`<p>Consider the following normal form game and answer the given sub questions:</p>${M.mat({ rows: ['Top', 'Bottom'], cols: ['Left', 'Right'], cells: [['8, 2', '1, 6'], ['3, 5', '4, 1']], rp: 'Player 1', cp: 'Player 2', br: false })}`,
  g26: R`<p>Consider the following normal form game and answer the given sub questions:</p>${M.mat({ rows: ['Top', 'Bottom'], cols: ['Left', 'Right'], cells: [['5, 4', '0, 3'], ['3, 2', '1, 7']], rp: 'Player 1', cp: 'Player 2', br: false })}`
};

const AUC_M35 = M.mat({ rows: ['b₁=0', 'b₁=1', 'b₁=2'], cols: ['b₂=0', 'b₂=1', 'b₂=2'], cells: [['1.5, 2.5', '0, 4', '0, 3'], ['2, 0', '1, 2', '0, 3'], ['1, 0', '1, 0', '0.5, 1.5']] });
const AUC_M54 = M.mat({ rows: ['b₁=0', 'b₁=1', 'b₁=2'], cols: ['b₂=0', 'b₂=1', 'b₂=2'], cells: [['2.5, 2', '0, 3', '0, 2'], ['4, 0', '2, 1.5', '0, 2'], ['3, 0', '3, 0', '1.5, 1']] });
function aucDom(paper, qno, marks, v) {
  const p35 = v === 35;
  return PQ(paper, qno, marks, 'MCQ', { week: 1, cs: ['dominance', 'mixed-dom', 'normal-form'], diff: 'Moderate', cat: 'Payoff matrix analysis', type: 'mcq', ctx: p35 ? CTX.auc35 : CTX.auc54,
    stem: 'Which player does not have strictly dominated strategy?', opts: ['Player 1', 'Player 2', 'None'], ans: p35 ? 0 : 1,
    sol: (p35 ? AUC_M35 : AUC_M54) + (p35
      ? R`<ol><li>Build cells: winner gets $v_i-b_i$; ties give $\tfrac12(v_i-b)$ each.</li><li>Player 2 (second entries, by column vs $b_1=0,1,2$): $b_2=0:(2.5,0,0)$, $b_2=1:(4,2,0)$, $b_2=2:(3,3,1.5)$. $b_2=2$ beats $b_2=0$ in every entry ⇒ player 2 <b>has</b> a strictly dominated strategy.</li><li>Player 1 (rows): $b_1=0:(1.5,0,0)$, $b_1=1:(2,1,0)$, $b_1=2:(1,1,0.5)$. 1 vs 0: tie (0 = 0) in the last column; 2 vs 0: $1<1.5$ in the first column; 1 vs 2 and 2 vs 1 each lose somewhere. No pure strategy of player 1 is strictly dominated.</li></ol><p>Answer: <b>Player 1</b>.</p>`
      : R`<ol><li>Player 1 (rows vs $b_2=0,1,2$): $b_1=0:(2.5,0,0)$, $b_1=1:(4,2,0)$, $b_1=2:(3,3,1.5)$ ⇒ $b_1=2$ strictly dominates $b_1=0$.</li><li>Player 2 (columns vs $b_1=0,1,2$): $b_2=0:(2,0,0)$, $b_2=1:(3,1.5,0)$, $b_2=2:(2,2,1)$. 1 vs 0 ties at the last entry; 2 vs 0 ties at the first (2 = 2); 1 vs 2 mixed signs. No pure strict domination.</li></ol><p>Answer: <b>Player 2</b>. The values are swapped relative to the 3/5 version, so the roles swap.</p>`),
    why: p35 ? ['Correct — no pure bid of player 1 beats another in every column.', 'Player 2’s bid 0 is strictly dominated by bid 2.', 'Player 1 has none, so “None” is wrong.'] : ['Player 1’s bid 0 is strictly dominated by bid 2.', 'Correct.', 'Player 2 has none.'],
    concept: R`<p>Strict dominance compares two strategies against every opponent action; one tie destroys strictness. Pure-strategy comparison is the keyed convention.</p>`,
    trap: R`<p>(1) The question asks who does <em>not</em> have one. (2) Ties (diagonal cells) need the factor ½. (3) Nuance: the low bid of the “no dominated strategy” player <em>is</em> strictly dominated by a mixture (e.g. ¾·bid1 + ¼·bid2 for v=3,5); the key follows pure-strategy domination.</p>`,
    misc: 'Calling a strategy strictly dominated despite a tie.', keyNote: p35 ? '' : 'Values 5 and 4 in this paper.' });
}
function aucIESDS(paper, qno, marks, v) {
  const p35 = v === 35;
  return PQ(paper, qno, marks, 'MCQ', { week: 2, cs: ['iesds', 'dominance', 'assumptions'], diff: 'Moderate', cat: 'Payoff matrix analysis', type: 'mcq', ctx: p35 ? CTX.auc35 : CTX.auc54,
    stem: 'Which strategies survive Iterated Elimination of Strictly Dominated Strategy?', opts: ['(0, 0)', '(1, 1)', '(2, 2)', 'None'], ans: 2,
    sol: p35 ? R`<ol><li>P2: delete $b_2=0$ (dominated by $b_2=2$).</li><li>P1 vs columns {1,2}: $b_1=0$ (0,0), $b_1=1$ (1,0), $b_1=2$ (1,0.5) ⇒ delete $b_1=0$.</li><li>P2 vs rows {1,2}: $b_2=1$ (2,0), $b_2=2$ (3,1.5) ⇒ delete $b_2=1$.</li><li>P1 vs column 2: $b_1=1$ gives 0, $b_1=2$ gives 0.5 ⇒ delete $b_1=1$.</li></ol><p>Survivor <b>(2, 2)</b>, payoffs (0.5, 1.5).</p>`
      : R`<ol><li>P1: delete $b_1=0$ (dominated by $b_1=2$: (3,3,1.5) vs (2.5,0,0)).</li><li>P2 vs rows {1,2}: $b_2=0$ (0,0), $b_2=1$ (1.5,0), $b_2=2$ (2,1) ⇒ delete $b_2=0$ and $b_2=1$.</li><li>P1 vs column 2: $b_1=1$ gives 0, $b_1=2$ gives 1.5 ⇒ delete $b_1=1$.</li></ol><p>Survivor <b>(2, 2)</b>, payoffs (1.5, 1).</p>`,
    why: ['Bid 0 is eliminated for both.', 'Bid 1 is eliminated in later rounds.', 'Correct.', 'IESDS leaves exactly one profile here.'],
    concept: R`<p>IESDS removes strictly dominated strategies round by round; the order does not matter; a unique survivor is the unique NE.</p>`,
    trap: R`<p>Stopping after round 1, or deleting weakly dominated strategies. The options list profiles as (b₁, b₂).</p>`, misc: 'Stopping after the first deletion.' });
}
const TREE1_NF = M.mat({ rows: ['AE', 'AF', 'BE', 'BF'], cols: ['C', 'D'], cells: [['2, 0', '2, 0'], ['2, 0', '2, 0'], ['3, 1', '0, 0'], ['3, 1', '1, 2']], br: true, ne: 'auto' });
const TREE2_NF = M.mat({ rows: ['AE', 'AF', 'BE', 'BF'], cols: ['C', 'D'], cells: [['2, 0', '2, 0'], ['2, 0', '2, 0'], ['3, 2', '2, 1'], ['3, 2', '1, 2']], br: true, ne: 'auto' });
function treeSet(paper, q0, v2, opts = {}) {
  const ctx = v2 ? CTX.tree2 : CTX.tree1, out = [];
  const T = (k, o) => { if (opts.skip && opts.skip.includes(k)) return; out.push(PQ(paper, q0 + k, o.marks || 1, 'MCQ', Object.assign({ week: 4, ctx, type: 'mcq', ctxOpen: k === 0 }, o))); };
  const tv = v2 ? PYQTREE('(2,0)', '(3,2)', '(2,1)', '(1,2)') : PYQTREE('(2,0)', '(3,1)', '(0,0)', '(1,2)');
  T(0, { cs: ['info-sets', 'classify', 'tree'], diff: 'Easy', cat: 'Extensive-form', stem: 'This is a game of', opts: ['Perfect information', 'Imperfect information', 'None', 'Can’t be determined'], ans: 0,
    sol: tv + R`<p>Each mover observes all earlier moves; every information set is a single node ⇒ <b>perfect information</b>.</p>`, why: ['Correct.', 'No node is grouped with another (no dotted lines).', 'One of the two applies.', 'The description fully determines the tree.'], trap: R`<p>Do not confuse perfect information (observing past moves) with complete information (knowing payoffs).</p>` });
  T(1, { cs: ['tree'], diff: 'Easy', cat: 'Extensive-form', stem: 'How many terminal nodes does this game have?', opts: ['3', '2', '4', '5'], ans: 2,
    sol: R`<p>Endings after A, C, E, F ⇒ <b>4</b> terminal nodes (one per payoff vector).</p>`, why: ['That counts decision nodes.', 'Too few.', 'Correct.', 'There are only four payoff vectors.'], trap: R`<p>Counting decision nodes (3) instead of terminal nodes.</p>` });
  T(2, { cs: ['info-sets', 'tree'], diff: 'Easy', cat: 'Extensive-form', stem: 'How many information sets does this game have?', opts: ['2', '3', '4', '1'], ans: 1,
    sol: R`<p>With perfect information, information sets = decision nodes: P1 root, P2 after B, P1 after D ⇒ <b>3</b>.</p>`, why: ['Counts players, not information sets.', 'Correct.', 'Terminal nodes are not information sets.', 'Each decision node is its own set.'], trap: R`<p>Counting players (2) or terminal nodes (4).</p>` });
  T(3, { cs: ['ef-strategy', 'action-strategy'], diff: 'Easy', cat: 'Extensive-form', stem: 'How many pure strategies does player 1 have?', opts: ['1', '2', '3', '4'], ans: 3,
    sol: R`<p>Two information sets with 2 actions each: $2\times2=4$ — AE, AF, BE, BF.</p>`, why: ['Player 1 has two information sets.', 'Ignores the second decision.', 'Writes A, BE, BF — omits the plan at the unreached node.', 'Correct.'], trap: R`<p>A strategy specifies an action at every own information set, even after A ends the game.</p>` });
  T(4, { cs: ['ef-strategy'], diff: 'Easy', cat: 'Extensive-form', stem: 'How many pure strategies does player 2 have?', opts: ['1', '2', '3', '4'], ans: 1,
    sol: R`<p>One information set with actions C, D ⇒ 2.</p>`, why: ['Player 2 has two actions.', 'Correct.', 'Player 2 has two actions at one information set.', 'Player 2 moves only once.'] });
  T(5, { cs: ['ef-to-nf', 'nash'], diff: v2 ? 'Difficult' : 'Moderate', cat: 'Extensive-form', stem: 'How many pure strategy Nash equilibria does this game have?', opts: ['1', '2', '3', '4'], ans: v2 ? 3 : 2,
    sol: (v2 ? TREE2_NF : TREE1_NF) + (v2
      ? R`<p>P1 vs C → BE, BF; vs D → AE, AF, BE (all 2). P2 vs AE/AF → C or D (both 0); vs BE → C (2 > 1); vs BF → C or D (2 = 2). NE: (BE,C), (BF,C), (AE,D), (AF,D) ⇒ <b>4</b>.</p>`
      : R`<p>P1 vs C → BE, BF (3); vs D → AE, AF (2). P2 vs AE/AF → C or D (0 = 0); vs BE → C; vs BF → D. NE: (BE,C), (AE,D), (AF,D) ⇒ <b>3</b>.</p>`),
    why: v2 ? ['Only the SPE.', 'Misses the indifference equilibria.', 'Misses (BF,C), where P2 is indifferent (2 = 2).', 'Correct.'] : ['Only counts the SPE.', 'Misses one of AE/AF.', 'Correct.', '(BF,C) fails: P2 prefers D against BF.'],
    trap: R`<p>Missing equilibria where player 2 is indifferent (against AE and AF every column gives 0). Counting only the backward-induction outcome.</p>`, misc: 'Ignoring ties when underlining.' });
  T(6, { cs: ['spe', 'backward'], marks: opts.speMarks || 2, diff: 'Moderate', cat: 'Extensive-form', stem: 'Which one of the Nash equilibria is also a subgame perfect equilibrium?', opts: ['(AE, D)', '(AF, D)', '(BE, C)', '(BF, C)'], ans: v2 ? 2 : 1,
    sol: (v2 ? PYQTREE('(2,0)', '(3,2)', '(2,1)', '(1,2)', { B: 1, C: 1, E: 1 }) : PYQTREE('(2,0)', '(3,1)', '(0,0)', '(1,2)', { A: 1, D: 1, F: 1 })) + (v2
      ? R`<ol><li>Last node: E (2) > F (1).</li><li>P2: C gives 2; D gives 1 (via E) ⇒ C.</li><li>Root: A gives 2; B gives 3 ⇒ B.</li></ol><p>SPE <b>(BE, C)</b>.</p>`
      : R`<ol><li>Last node: F (1) > E (0).</li><li>P2: C gives 1; D gives 2 (via F) ⇒ D.</li><li>Root: A gives 2; B gives 1 ⇒ A.</li></ol><p>SPE <b>(AF, D)</b>.</p>`),
    why: v2 ? ['D is not optimal for P2 given E.', 'D is not optimal for P2.', 'Correct.', 'F is not optimal at the last node (1 < 2).'] : ['E is not optimal at the last node (0 < 1): non-credible.', 'Correct.', 'C is not optimal for P2 (1 < 2).', 'C is not optimal for P2.'],
    trap: R`<p>(AE,D) and (AF,D) give the same outcome; only the off-path choice distinguishes them.</p>`, keyNote: opts.trunc ? 'Options are truncated in the supplied file (page cut off); options reconstructed from the identical item in the other papers; key not visible — answer independently derived.' : '' , key: opts.trunc ? 'derived' : 'official' });
  T(7, { cs: ['subgame'], diff: 'Easy', cat: 'Extensive-form', stem: 'No. of sub games this game has', opts: ['1', '2', '3', '4'], ans: 2,
    sol: R`<p>In a perfect-information game every decision node starts a subgame: root, after B, after D ⇒ <b>3</b> (including the whole game).</p>`, why: ['Only the whole game.', 'Proper subgames only.', 'Correct.', 'Terminal nodes do not start subgames.'], trap: R`<p>Forgetting the whole game counts as a subgame.</p>` });
  return out;
}
function drugMCQ(paper, q0, n, marks) {
  const ctx = n === 100 ? CTX.drug100 : CTX.drug500;
  const brs = n === 100 ? R`Police: vs Street → Street (80 > 10); vs Park → Park (60 > 0). Dealer: vs Street → Park (100 > 20); vs Park → Street (90 > 40).` : R`Police: vs Street → Street (400 > 100); vs Park → Park (300 > 0). Dealer: vs Street → Park (500 > 100); vs Park → Street (400 > 200).`;
  return [
    PQ(paper, q0, marks[0], 'MCQ', { week: 2, cs: ['nash', 'classic-games', 'zero-sum'], diff: 'Easy', cat: 'Payoff matrix analysis', type: 'mcq', ctx, stem: 'Choose the correct statement',
      opts: ['There is a unique Nash equilibrium in pure strategy', 'There are finitely many Nash equilibria in this game in pure strategy', 'There is no Nash equilibrium in this game in pure strategy', 'None' + (paper === '2024 T2' ? ' of these' : '')], ans: 2,
      sol: R`<p>${brs} The police want to match, the dealer to mismatch: best responses cycle, so no cell is a mutual best response.</p>`, why: ['No cell has both best responses.', 'There are none.', 'Correct.', 'Option C is correct.'],
      trap: R`<p>Reading the dealer’s payoff as the first number.</p>` }),
    PQ(paper, q0 + 1, marks[1], 'MCQ', { week: 3, cs: ['nash-existence', 'br-graph', 'indifference'], diff: 'Moderate', cat: 'Mixed strategies', type: 'mcq', ctx, stem: 'Choose the correct statement',
      opts: ['There is a unique Nash equilibrium in this game', 'There are finitely many Nash equilibria in this game', 'There is no Nash equilibrium in this game', 'None' + (paper === '2024 T2' ? ' of these' : '')], ans: 0,
      sol: R`<p>Finite game ⇒ at least one (mixed) NE (Nash’s theorem). No pure NE, and the best-response step functions cross exactly once at ${n === 100 ? '(p, q) = (5/13, 6/13)' : '(p, q) = (1/3, 1/2)'} ⇒ <b>unique</b> NE.</p>`,
      why: ['Correct.', '“Finitely many” is technically true of one, but the precise statement is uniqueness; the key marks A.', 'Nash’s theorem guarantees existence.', 'A is correct.'],
      trap: R`<p>Confusing “no pure NE” with “no NE”.</p>` })];
}

PQ('2024 T3', 122, 2, 'MCQ', { week: 2, cs: ['best-response', 'continuous-ne'], diff: 'Easy', cat: 'Continuous games', type: 'mcq', ctx: CTX.syn(''), stem: R`What is the best response function of player $i$ for all $e_i\ge0$`,

PQ('2025 T3', 100, 3, 'Numeric (SA)', { week: 3, cs: ['indifference', 'mixed-strategy'], diff: 'Difficult', cat: 'Mixed strategies', type: 'num', ctx: CTX.g25, stem: R`If under mixed strategy equilibrium, let $p$ and $q$ denote the probability of player 1’s choosing ‘Top’ and player 2’s choosing ‘Left’, respectively, value of $\dfrac{1}{p-q}$ will be`, ans: 8,
